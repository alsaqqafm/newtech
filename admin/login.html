<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - لوحة التحكم</title>
  <link rel="stylesheet" href="css/admin.css">
  <script>
    if (localStorage.getItem('adminLoggedIn') === 'true' && localStorage.getItem('adminToken')) {
      if (window.location.protocol === 'file:') {
        window.location.href = 'index.html';
      } else {
        fetch('/api/me', {
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('adminToken') }
        })
        .then(function(r) {
          if (r.ok) window.location.href = 'index.html';
          else {
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
          }
        })
        .catch(function() {
          // Server unreachable, allow visit login page
        });
      }
    }
  </script>
  <style>
    body {
      background: linear-gradient(135deg, var(--brand-navy-dark, #0a0d26) 0%, var(--brand-navy, #0f153d) 50%, #16204c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(13,110,253,0.15) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      border-radius: 50%;
      animation: floatBg 8s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(25,135,84,0.1) 0%, transparent 70%);
      bottom: -80px;
      left: -80px;
      border-radius: 50%;
      animation: floatBg 10s ease-in-out infinite reverse;
    }

    @keyframes floatBg {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -30px); }
    }

    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    .login-card {
      background: rgba(30, 41, 59, 0.8);
      /* backdrop-filter: blur(20px); */
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      animation: cardIn 0.5s ease;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo img {
      width: auto;
      height: 60px;
      max-width: 200px;
      margin-bottom: 16px;
      object-fit: contain;
    }

    .login-logo h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .login-logo p {
      font-size: 13px;
      color: #94a3b8;
    }

    .login-form .form-group {
      margin-bottom: 20px;
    }

    .login-form label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 15px;
      transition: color 0.2s;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 44px 12px 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      font-size: 14px;
      color: #e2e8f0;
      outline: none;
      transition: all 0.3s;
    }

    .input-wrapper input::placeholder {
      color: #64748b;
    }

    .input-wrapper input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2,132,199,0.2);
    }

    .input-wrapper input:focus + i,
    .input-wrapper input:focus ~ i {
      color: #0284c7;
    }

    .input-wrapper:focus-within i {
      color: #0284c7;
    }

    .password-toggle {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px;
      font-size: 15px;
      transition: color 0.2s;
    }

    .password-toggle:hover {
      color: #0284c7;
    }

    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #94a3b8;
    }

    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #0284c7;
      cursor: pointer;
    }

    .forgot-password {
      font-size: 13px;
      color: #0284c7;
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-password:hover {
      color: #38bdf8;
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #0284c7 0%, #0c4a6e 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(2,132,199,0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .login-btn .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    .login-btn.loading .btn-text { display: none; }
    .login-btn.loading .spinner { display: block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
    }

    .login-footer a {
      color: #94a3b8;
      text-decoration: none;
    }

    .login-footer a:hover {
      color: #fff;
    }

    .error-message {
      background: rgba(220,53,69,0.1);
      border: 1px solid rgba(220,53,69,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #fca5a5;
      animation: shake 0.4s ease;
    }

    .error-message.show {
      display: flex;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .back-to-site {
      position: fixed;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 13px;
      padding: 8px 14px;
      background: rgba(30, 41, 59, 0.6);
      /* backdrop-filter: blur(10px); */
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      transition: all 0.2s;
      z-index: 10;
    }

    .back-to-site:hover {
      color: #fff;
      background: rgba(30, 41, 59, 0.9);
    }
  </style>
</head>
<body>
  <a href="../index.html" class="back-to-site">
    <i class="fas fa-arrow-right"></i>
    العودة للموقع
  </a>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <img src="../images/logo.png" alt="نيوتك الطبية">
        <h1>لوحة التحكم</h1>
        <p>نيوتك الطبية - نظام الإدارة</p>
      </div>

      <div class="error-message" id="errorMsg">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText">بيانات الدخول غير صحيحة</span>
      </div>

      <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">اسم المستخدم أو البريد الإلكتروني</label>
          <div class="input-wrapper">
            <input type="text" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
            <i class="fas fa-user"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
            <i class="fas fa-lock"></i>
            <buton type="button" class="password-toggle" onclick="togglePassword()">
              <i class="fas fa-eye" id="toggleIcon"></i>
            </buton>
          </div>
        </div>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            تذكرني
          </label>
          <a href="#" class="forgot-password" onclick="showToast('يرجى التواصل مع مدير النظام')">نسيت كلمة المرور؟</a>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="btn-text">تسجيل الدخول</span>
          <div class="spinner"></div>
        </button>
      </form>

      <div class="login-footer">
        <p>© 2026 نيوتك الطبية. جميع الحقوق محفوظة</p>
        <p style="margin-top: 6px; font-size: 12px; color: #64748b;">
          تم التطوير بواسطة <a href="https://www.heybasoft.com/" target="_blank" rel="noopener noreferrer" style="color: #38bdf8; text-decoration: none; font-weight: 600;">هيبه سوفت للبرمجيات | Heyba Soft</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // Toggle password visibility
    function togglePassword() {
      var passwordInput = document.getElementById('password');
      var toggleIcon = document.getElementById('toggleIcon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var loginBtn = document.getElementById('loginBtn');
      var errorMsg = document.getElementById('errorMsg');
      var errorText = document.getElementById('errorText');

      errorMsg.classList.remove('show');
      loginBtn.classList.add('loading');
      loginBtn.disabled = true;

      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      })
      .then(function(r) {
        if (!r.ok) throw new Error('unauthorized');
        return r.json();
      })
      .then(function(data) {
        localStorage.setItem('adminLoggedIn', 'true');
        localStorage.setItem('adminToken', data.token);
        localStorage.setItem('adminUser', JSON.stringify(data.user));
        if (document.getElementById('rememberMe').checked) {
          localStorage.setItem('adminRemember', 'true');
        }
        loginBtn.classList.remove('loading');
        loginBtn.innerHTML = '<i class="fas fa-check" style="font-size:18px"></i>';
        loginBtn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
        setTimeout(function() { window.location.href = 'index.html'; }, 800);
      })
      .catch(function() {
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
        errorMsg.classList.add('show');
        errorText.textContent = 'بيانات الدخول غير صحيحة. يرجى المحاولة مرة أخرى.';
        var card = document.querySelector('.login-card');
        card.style.animation = 'none';
        card.offsetHeight;
        card.style.animation = 'shake 0.4s ease';
      });
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
